<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحادثات</title>
  <style>
    :root { --bg: #fff; --sec: #f0f2f5; --hov: #e4e6eb; --act: #e7f3ff; --brd: #ddd; --txt: #050505; --sub: #65676b; --blue: #0084ff; }
    [data-theme="dark"] { --bg: #18191a; --sec: #242526; --hov: #3a3b3c; --act: #263951; --brd: #2f3031; --txt: #e4e6eb; --sub: #b0b3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--txt); overflow: hidden; }
    .app { display: flex; height: 100vh; width: 100vw; }
    .side { width: 320px; border-left: 1px solid var(--brd); display: flex; flex-direction: column; }
    .top { padding: 14px; display: flex; justify-content: space-between; align-items: center; }
    .btn-c { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--sec); color: var(--txt); cursor: pointer; }
    .srch { margin: 0 14px 10px; padding: 9px 14px; border-radius: 20px; border: 0; background: var(--sec); color: var(--txt); outline: none; }
    .list { flex: 1; overflow-y: auto; padding: 0 8px; }
    .item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer; }
    .item:hover { background: var(--hov); }
    .item.act { background: var(--act); }
    .av { width: 46px; height: 46px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-weight: bold; position: relative; flex-shrink: 0; }
    .dot { width: 11px; height: 11px; background: #31a24c; border: 2px solid var(--bg); border-radius: 50%; position: absolute; bottom: 0; right: 0; }
  </style>
  <style>
    .main { flex: 1; display: flex; flex-direction: column; }
    .head { height: 60px; padding: 0 16px; border-bottom: 1px solid var(--brd); display: flex; justify-content: space-between; align-items: center; }
    .msgs { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .bub { max-width: 70%; padding: 9px 14px; border-radius: 18px; font-size: 14.5px; line-height: 1.4; }
    .rec { background: var(--sec); color: var(--txt); align-self: flex-start; border-bottom-right-radius: 4px; }
    .snt { background: var(--blue); color: #fff; align-self: flex-end; border-bottom-left-radius: 4px; }
    .foot { padding: 10px 14px; border-top: 1px solid var(--brd); display: flex; gap: 8px; align-items: center; }
    .inp { flex: 1; padding: 9px 15px; border-radius: 20px; border: 0; background: var(--sec); color: var(--txt); outline: none; }
    .send { background: 0; border: 0; color: var(--blue); font-size: 20px; cursor: pointer; }
    .info { width: 260px; border-right: 1px solid var(--brd); padding: 24px 14px; text-align: center; }
    .info.hide { display: none; }
    @media (max-width: 850px) { .info { display: none; } }
    @media (max-width: 600px) { .side { width: 72px; } .meta, .srch, .top h2 { display: none; } }
  </style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="top"><h2>الدردشات</h2><button class="btn-c" id="thm">🌙</button></div>
    <input class="srch" placeholder="بحث في Messenger..." />
    <div class="list">
      <div class="item act"><div class="av">س<span class="dot"></span></div><div class="meta"><b>سارة المنصور</b><div style="font-size:12px;color:var(--sub)">التصميم يعمل بنجاح!</div></div></div>
      <div class="item"><div class="av" style="background:#e91e63">خ</div><div class="meta"><b>خالد العتيبي</b><div style="font-size:12px;color:var(--sub)">مرحباً بك في المنصة</div></div></div>
    </div>
  </aside>
  <main class="main">
    <header class="head">
      <div style="display:flex;align-items:center;gap:10px"><div class="av" style="width:36px;height:36px">س<span class="dot"></span></div><div><b>سارة المنصور</b><div style="font-size:11px;color:#31a24c">نشطة الآن</div></div></div>
      <button class="send" id="infBtn">ⓘ</button>
    </header>
    <div class="msgs" id="box">
      <div class="bub rec">أهلاً بك! جرب التصميم الجديد الآن.</div>
      <div class="bub snt">يعمل بشكل مطابق لماسنجر تماماً!</div>
    </div>
    <footer class="foot">
      <input class="inp" id="txt" placeholder="Aa" />
      <button class="send" id="snd">👍</button>
    </footer>
  </main>
  <aside class="info" id="inf">
    <div class="av" style="width:70px;height:70px;margin:0 auto 10px;font-size:24px">س</div>
    <b>سارة المنصور</b><p style="font-size:12px;color:var(--sub);margin-top:4px">عضو في المنصة</p>
  </aside>
</div>
<script>
  const b = document.body, t = document.getElementById('txt'), s = document.getElementById('snd'), box = document.getElementById('box');
  document.getElementById('thm').onclick = () => b.dataset.theme = b.dataset.theme === 'dark' ? '' : 'dark';
  document.getElementById('infBtn').onclick = () => document.getElementById('inf').classList.toggle('hide');
  t.oninput = () => s.textContent = t.value.trim() ? '➤' : '👍';
  const go = () => { if(!t.value.trim()) return; box.innerHTML += `<div class="bub snt">${t.value}</div>`; t.value = ''; s.textContent = '👍'; box.scrollTop = box.scrollHeight; };
  s.onclick = go; t.onkeypress = e => { if(e.key === 'Enter') go(); };
</script>
</body>
</html>
